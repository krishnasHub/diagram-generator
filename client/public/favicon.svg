<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background pill -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Top node -->
  <rect x="10" y="3" width="12" height="7" rx="2" fill="#3b82f6"/>

  <!-- Stem -->
  <line x1="16" y1="10" x2="16" y2="14" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Diamond (decision) -->
  <polygon points="16,14 22,18 16,22 10,18" fill="#1d4ed8"/>

  <!-- Left branch -->
  <line x1="10" y1="18" x2="7" y2="22" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right branch -->
  <line x1="22" y1="18" x2="25" y2="22" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom-left node -->
  <rect x="3" y="22" width="8" height="6" rx="1.5" fill="#2563eb"/>
  <!-- Bottom-right node -->
  <rect x="21" y="22" width="8" height="6" rx="1.5" fill="#2563eb"/>
</svg>
